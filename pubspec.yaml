name: simple_webp_converter
description: "Convert a single video to animated WebP on device."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.3.2
  # Match the reference project's resolved versions when copying its features.
  ffmpeg_kit_flutter_new: 3.2.0
  file_picker: 10.3.10
  video_player: 2.11.1
  path_provider: 2.1.6
  image_picker: 1.2.3
  shared_preferences: 2.5.5
  photo_manager: 3.12.0
  pro_video_editor: 1.22.0
  pro_image_editor: 12.0.0
  audioplayers: 5.2.1
  share_plus: 12.0.1
  flutter_local_notifications: 19.5.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: 0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
